name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  CI_UPLOAD_TOKEN: ${{ secrets.CI_UPLOAD_TOKEN }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web dir and sync
        run: |
          mkdir -p out
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to server
        if: env.CI_UPLOAD_TOKEN != ''
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          # 海外 runner → 国内服务器链路偶发慢：重试 5 次应对雨云转发超时(408)
          curl -f --retry 5 --retry-delay 5 --retry-all-errors --max-time 180 \
            -X POST "http://whitecraft.cn:10032/api/upload-apk" \
            -H "Authorization: Bearer $CI_UPLOAD_TOKEN" \
            -F "file=@android/app/build/outputs/apk/debug/app-debug.apk;filename=tylibrary-v${VERSION}.apk"
          echo "已上传 tylibrary-v${VERSION}.apk"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tianyang-library-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
