name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web dir and sync
        run: |
          mkdir -p out
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          APK_NAME="天央图书馆-v${VERSION}.apk"
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          # 服务器通过 Release 拉取（海外 runner 直传国内服务器超时，Release 走 GitHub 内部网络稳定）
          gh release delete "v${VERSION}" --yes --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "自动构建" --repo "${{ github.repository }}"
          RELEASE_ID=$(gh release view "v${VERSION}" --json id --jq '.id' --repo "${{ github.repository }}")
          APK_NAME_ENCODED=$(jq -rn --arg value "$APK_NAME" '$value | @uri')
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${APK_PATH}" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${APK_NAME_ENCODED}"
          echo "已发布 Release v${VERSION}（天央图书馆-v${VERSION}.apk）"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tianyang-library-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
